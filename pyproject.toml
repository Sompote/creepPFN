[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creep-pfn"
version = "0.2.0"
description = "CreepPFN: concrete creep forecasting with a transformer trained on a hierarchical Bayesian prior"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Sompote Youwai"},
  {name = "Warayut Dokduea"},
  {name = "Weerachart Tangchirapat"},
]
dependencies = [
  "numpy==1.26.4",
  "torch>=2.2,<3",
  "pandas>=2,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "gradio>=4.44,<6",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
research = ["jax>=0.4", "numpyro>=0.15", "xgboost>=2"]

[project.scripts]
creep-pfn = "creep_prior.application:main"
creep-pfn-gradio = "creep_prior.gradio_app:main"

[tool.setuptools.packages.find]
include = ["creep_prior*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
